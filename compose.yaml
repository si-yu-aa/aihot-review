services:
  aihot-review:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      AIHOT_DATA_DIR: /data
      AIHOT_ITEMS_URL: ${AIHOT_ITEMS_URL:-https://aihot.virxact.com/api/public/items}
    volumes:
      - aihot-data:/data

volumes:
  aihot-data:
